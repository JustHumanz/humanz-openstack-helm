apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: masakari-host-monitor-nodes
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: masakari-host-monitor-nodes
subjects:
- kind: ServiceAccount
  name: masakari-host-monitor
  namespace: openstack
roleRef:
  kind: ClusterRole
  name: masakari-host-monitor-nodes
  apiGroup: rbac.authorization.k8s.io