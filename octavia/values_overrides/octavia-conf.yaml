labels:
  api:
    node_selector_key: openstack-control-plane

conf:
  octavia_api_uwsgi:
    uwsgi:
      wsgi-file: /var/lib/openstack/bin/octavia-wsgi
  octavia:
    DEFAULT:
      debug: "True"
      log_config_append: null
    api_settings:
      default_provider_driver: amphorav2
      healthcheck_enabled: false
    certificates:
      ca_certificate: /etc/octavia/certs/server/ca.crt
      ca_private_key: /etc/octavia/certs/server/tls.key
      ca_private_key_passphrase: null
      endpoint_type: internalURL
      insecure: "True"
    haproxy_amphora:
      client_cert: /etc/octavia/certs/client/tls-combined.pem
      server_ca: /etc/octavia/certs/server/ca.crt
    controller_worker:
      amp_image_owner_id: ffb8d187fca34420ac1079cd2fe71a22
      amp_secgroup_list: 28775db2-e2ea-4175-9d8e-a9547fdcbc48
      amp_flavor_id: c498cc51-18e9-49aa-8760-8e410fc301d6
      amp_boot_network_list: 56705508-8792-41d1-ae3c-276860f06f81
      amp_ssh_key_name: octavia-key
      amp_image_tag: octavia-amphora-image
      network_driver: allowed_address_pairs_driver
      compute_driver: compute_nova_driver
      amphora_driver: amphora_haproxy_rest_driver
      client_ca: /etc/octavia/certs/client/ca.crt
      workers: 4
    task_flow:
      jobboard_enabled: false
    health_manager:
      controller_ip_port_list: "192.168.20.100:5555"
    cinder:
      endpoint_type: internalURL
      insecure: "True"
    glance:
      endpoint_type: internalURL
      insecure: "True"
    neutron:
      endpoint_type: internalURL
      insecure: "True"
    nova:
      endpoint_type: internalURL
      insecure: "True"
    keystone_authtoken:
      endpoint_type: internalURL
      insecure: "True"
    service_auth:
      insecure: "True"

endpoints:
  load_balancer:
    name: octavia
    hosts:
      default: octavia-api
    scheme:
      public: https
    port:
      api:
        public: 443

manifests:
  ingress_api: true
  service_ingress_api: true

network:
  api:
    node_port:
      enabled: true
      port: 32534
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /

pod:
  probes:
    api:
      octavia-api:
        liveness:
          enabled: false
        readiness:
          enabled: false
  replicas:
    api: 1
    worker: 1
    housekeeping: 1
  mounts:
    octavia_api:
      octavia_api:
        volumeMounts:
          - name: octavia-server-ca
            mountPath: /etc/octavia/certs/server
          - name: octavia-client-certs
            mountPath: /etc/octavia/certs/client
        volumes:
          - name: octavia-server-ca
            secret:
              secretName: octavia-server-ca
          - name: octavia-client-certs
            secret:
              secretName: octavia-client-certs
    octavia_worker:
      octavia_worker:
        volumeMounts:
          - name: octavia-server-ca
            mountPath: /etc/octavia/certs/server
          - name: octavia-client-certs
            mountPath: /etc/octavia/certs/client
        volumes:
          - name: octavia-server-ca
            secret:
              secretName: octavia-server-ca
          - name: octavia-client-certs
            secret:
              secretName: octavia-client-certs
    octavia_housekeeping:
      octavia_housekeeping:
        volumeMounts:
          - name: octavia-server-ca
            mountPath: /etc/octavia/certs/server
          - name: octavia-client-certs
            mountPath: /etc/octavia/certs/client
        volumes:
          - name: octavia-server-ca
            secret:
              secretName: octavia-server-ca
          - name: octavia-client-certs
            secret:
              secretName: octavia-client-certs
    octavia_health_manager:
      octavia_health_manager:
        volumeMounts:
          - name: octavia-server-ca
            mountPath: /etc/octavia/certs/server
          - name: octavia-client-certs
            mountPath: /etc/octavia/certs/client
        volumes:
          - name: octavia-server-ca
            secret:
              secretName: octavia-server-ca
          - name: octavia-client-certs
            secret:
              secretName: octavia-client-certs

security_context:
    octavia_worker:
      container:
        octavia_worker:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
    octavia_health_manager:
      container:
        octavia_health_manager:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW

secrets:
  tls:
    load_balancer:
      api:
        public: humanz-cloud-tls