apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  generation: 1
  name: humanz-cloud-selfsigned-tls
  namespace: harbor
spec:
  commonName: '*.ctl1-humanz.cloud'
  dnsNames:
  - '*.ctl1-humanz.cloud'
  isCA: true
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
  secretName: humanz-cloud-tls
