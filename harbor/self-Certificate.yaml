apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-tls
  namespace: harbor
spec:
  secretName: humanz-cloud-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - harbor.ctl1-humanz.cloud
  issuerRef:
    kind: ClusterIssuer
    name: cluster-ca