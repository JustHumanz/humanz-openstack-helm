# DaemonSet to distribute CA certs to all nodes
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: registry-ca-setup
  namespace: openstack
spec:
  selector:
    matchLabels:
      app: registry-ca-setup
  template:
    metadata:
      labels:
        app: registry-ca-setup
    spec:
      hostPID: true
      containers:
      - name: setup
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          mkdir -p /host/etc/containerd/certs.d/harbor.ctl1-humanz.cloud
          cp /certs/tls.crt /host/etc/containerd/certs.d/harbor.ctl1-humanz.cloud/ca.crt
          cat > /host/etc/containerd/certs.d/harbor.ctl1-humanz.cloud/hosts.toml << 'TOML'
          server = "https://harbor.ctl1-humanz.cloud"
          [host."https://harbor.ctl1-humanz.cloud"]
            ca = "/etc/containerd/certs.d/harbor.ctl1-humanz.cloud/ca.crt"
          TOML
          echo "CA configured. Sleeping."
          sleep infinity
        volumeMounts:
        - name: host-etc
          mountPath: /host/etc
        - name: tls-certs
          mountPath: /certs
      volumes:
      - name: host-etc
        hostPath:
          path: /etc
      - name: tls-certs
        secret:
          secretName: humanz-cloud-tls
          items:
            - key: tls.crt
              path: tls.crt