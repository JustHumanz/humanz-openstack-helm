endpoints:
  identity:
    hosts:
      default: keystone-api
      internal: keystone-api
    scheme:
      public: https
    port:
      api:
        default: 5000
        public: 443
  orchestration:
    hosts:
      default: heat-api
    scheme:
      public: 'https'
    port:
      api:
        default: 8004
        public: 443
  cloudformation:
    hosts:
      default: heat-cfn
    scheme:
      public: 'https'
    port:
      api:
        default: 8000      
        public: 443
  # Cloudwatch does not get an entry in the keystone service catalog
  cloudwatch:
    hosts:
      default: heat-cloudwatch
    scheme:
      public: 'https'
    port:
      api:
        default: 8003
        public: 443      
jobs:
  engine_cleaner:
    cron: "*/45 * * * *"
    
manifests:
  ingress_api: true
  ingress_cfn: true
  service_ingress_api: true
  service_ingress_cfn: true

network:
  api:
    node_port:
      enabled: true
      port: 32528
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
  cfn:
    node_port:
      enabled: true
      port: 32529
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /

secrets:
  tls:
    orchestration:
      api:
        public: humanz-cloud-tls
    cloudformation:
      cfn:
        public: humanz-cloud-tls              