bootstrap:
  wait_for_computes:
    enabled: true

dependencies:
  dynamic:
    targeted:
      openvswitch:
        compute:
          pod: []

conf:
  ceph:
    enabled: true
  nova:
    DEFAULT:
      vif_plugging_is_fatal: true
      vif_plugging_timeout: 300
      cpu_allocation_ratio: 8.0
      ram_allocation_ratio: 1.0
    libvirt:
      cpu_mode: custom
      cpu_model: kvm64      
  overrides:
    nova_compute:
      hosts:
      - name: ctl1-humanz
        conf:
          nova:
            DEFAULT:
              reserved_host_memory_mb: "20480"
      - name: humanz-pc
        conf:
          nova:
            DEFAULT:
              reserved_host_memory_mb: "10240"              
      - name: storage-humanz
        conf:
          nova:
            DEFAULT:
              cpu_allocation_ratio: 16
    vnc:
      auth_schemes: none

endpoints:
  oslo_messaging:
    statefulset:
      replicas: 1
  identity:
    hosts:
      default: keystone-api
      internal: keystone-api
  image:
    hosts:
      default: glance-api
      internal: glance-api
  compute:
    hosts:
      default: nova-api
    scheme:
      public: 'https'
    port:
      api:
        public: 443
      novncproxy:
        default: 6080
  compute_metadata:
    hosts:
      default: nova-metadata
    port:
      metadata:
        public: 8775
  compute_novnc_proxy:
    scheme:
      public: 'https'
    port:
      novnc_proxy:
        public: 443

manifests:
  deployment_consoleauth: false
  deployment_placement: false
  ingress_metadata: false
  ingress_novncproxy: true
  ingress_osapi: true
  ingress_placement: false
  ingress_spiceproxy: false
  service_ingress_metadata: false
  service_ingress_novncproxy: true
  service_ingress_osapi: true
  service_ingress_placement: false
  service_placement: false
  service_ingress_spiceproxy: false

network:
  osapi:
    node_port:
      enabled: true
      port: 32533
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        cert-manager.io/cluster-issuer: selfsigned-cluster-issuer        
  novncproxy:
    ingress:
      annotations:
        cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
        nginx.org/websocket-services: "nova-novncproxy"
        nginx.org/proxy-read-timeout: "3600s"
        nginx.org/proxy-send-timeout: "3600s"

pod:
  probes:
    rpc_timeout: 60
    rpc_retries: 2
    compute:
      default:
        liveness:
          enabled: False
        readiness:
          enabled: False
        startup:
          enabled: False
secrets:
  tls:
    compute:
      osapi:
        public: humanz-cloud-tls
    compute_novnc_proxy:
      novncproxy:
        public: humanz-cloud-tls 