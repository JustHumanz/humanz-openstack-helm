name: OpenStack Helm deploy

on:
  push:
    branches: [master]
    paths:
      - '!.github/**'
      - 'openstack-helm/barbican/**/*.y*ml'
      - 'openstack-helm/cinder/**/*.y*ml'
      - 'openstack-helm/glance/**/*.y*ml'
      - 'openstack-helm/heat/**/*.y*ml'
      - 'openstack-helm/horizon/**/*.y*ml'
      - 'openstack-helm/keystone/**/*.y*ml'
      - 'openstack-helm/libvirt/**/*.y*ml'
      - 'openstack-helm/magnum/**/*.y*ml'
      - 'openstack-helm/neutron/**/*.y*ml'
      - 'openstack-helm/nova/**/*.y*ml'
      - 'openstack-helm/octavia/**/*.y*ml'
      - 'openstack-helm/openvswitch/**/*.y*ml'
      - 'openstack-helm/ovn/**/*.y*ml'
      - 'openstack-helm/placement/**/*.y*ml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      services:
        description: 'Space-separated services, e.g. "nova neutron"'
        required: true

permissions:
  contents: read

# Never run two deploys against the cluster at once
concurrency:
  group: openstack-deploy
  cancel-in-progress: false

env:
  FEATURES: ${{ vars.OPENSTACK_UBUNTU_VERSION }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # For comments: PRs only, ".redeploy" prefix, trusted authors only
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '.redeploy') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    outputs:
      services: ${{ steps.svc.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve services to deploy
        id: svc
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          INPUT_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail

          # Maps changed files to service names.
          # ASSUMPTION: charts live in openstack-helm/<service>/...  Adjust to your layout.
          files_to_services() {
            awk -F/ '$1=="openstack-helm" && NF>2 {print $2}'
          }

          case "$EVENT" in
            push)
              services=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" | files_to_services)
              ;;
            issue_comment)
              state=$(gh pr view "$PR_NUMBER" --json state -q .state)
              if [ "$state" != "MERGED" ]; then
                echo "::error::PR #$PR_NUMBER is not merged, nothing to redeploy"
                exit 1
              fi
              # ".redeploy nova neutron" -> explicit list; plain ".redeploy" -> PR's changed services
              explicit=$(head -n1 <<<"$COMMENT_BODY" | tr -d '\r' | sed -E 's/^\.redeploy[[:space:]]*//')
              if [ -n "$explicit" ]; then
                services=$(tr -s ' ,' '\n' <<<"$explicit")
              else
                services=$(gh pr diff "$PR_NUMBER" --name-only | files_to_services)
              fi
              ;;
            workflow_dispatch)
              services=$(tr -s ' ,' '\n' <<<"$INPUT_SERVICES")
              ;;
          esac

          services=$(grep -v '^$' <<<"$services" | sort -u || true)

          if grep -qvE '^[a-z0-9-]+$' <<<"$services"; then
            echo "::error::Invalid service name in: $services"
            exit 1
          fi

          json=$(jq -R -s -c 'split("\n") | map(select(length>0))' <<<"$services")
          echo "services=$json" >> "$GITHUB_OUTPUT"
          echo "Services to deploy: $json" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    if: needs.prepare.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WireGuard
        run: sudo apt-get update && sudo apt-get install -y wireguard resolvconf curl jq

      - name: Connect VPN
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Check keystone endpoint
        run: |
          curl -fsS --max-time 15 --retry 5 --retry-delay 5 --retry-all-errors \
            -o /dev/null http://keystone.ctl1-humanz.cloud

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Create kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Add OpenStack-Helm repo and plugin
        run: |
          helm repo add openstack-helm https://tarballs.opendev.org/openstack/openstack-helm
          helm plugin install https://opendev.org/openstack/openstack-helm-plugin

      - name: Decrypt password.yaml files
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mapfile -d '' files < <(find . -name 'password.yaml.enc' -print0)
          for f in "${files[@]}"; do
            gpg --quiet --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --output "${f%.enc}" --decrypt "$f" <<<"$GPG_PASSPHRASE"
          done

      - name: Deploy ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ -d "openstack-helm/$SERVICE" ]; then
            helm dependency build "openstack-helm/$SERVICE"
          else
            echo "Using upstream Helm chart for $SERVICE"
          fi
          chmod +x deploy.sh
          ./deploy.sh "$SERVICE"

      - name: Cleanup
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          sudo rm -f /etc/wireguard/wg0.conf
          rm -f "$HOME/.kube/config"
          find . -name 'password.yaml' -delete