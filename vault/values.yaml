server:
  auditStorage:
    enabled: true
    storageClass: rook-slow-cephfs
  dataStorage:
    enabled: true
    storageClass: rook-fast-cephfs
  ingress:
    enabled: true
    hosts:
    - host: vault.ctl1-humanz.cloud
    ingressClassName: nginx
    tls:
    - hosts:
      - vault.ctl1-humanz.cloud
      secretName: humanz-cloud-tls