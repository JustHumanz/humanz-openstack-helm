
conf:
  neutron:
    DEFAULT:
      router_distributed: True
      service_plugins: ovn-router
      l3_ha_network_type: geneve
      dns_domain: humanz-local.cloud
  plugins:
    ml2_conf:
      ml2:
        extension_drivers: port_security,dns
        type_drivers: flat,vlan,geneve
        tenant_network_types: geneve
      ml2_type_vlan:
        network_vlan_ranges: external:10:200
      ovn:
        ovn_l3_scheduler: leastloaded
        dns_servers: 8.8.8.8,1.1.1.1
        neutron_sync_mode: repair
        enable_distributed_floating_ip: true

endpoints:
  network:
    hosts:
      default: neutron-server
      internal: neutron-server
    scheme:
      public: 'https'
    port:
      api:
        public: 443

manifests:
  daemonset_dhcp_agent: false
  daemonset_l3_agent: false
  daemonset_metadata_agent: false
  daemonset_ovs_agent: false
  deployment_rpc_server: false
  daemonset_ovn_metadata_agent: true  
  ingress_server: true
  service_ingress_server: true          

network:
  backend:
    - openvswitch
    - ovn
  server:
    node_port:
      enabled: true
      port: 32532
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /

secrets:
  tls:
    network:
      server:
        public: humanz-cloud-tls