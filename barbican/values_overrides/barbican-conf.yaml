endpoints:
  key_manager:
    scheme:
      public: https
    port:
      api:
        public: 443

manifests:
  ingress_api: true
  service_ingress_api: true

network:
  api:
    node_port:
      enabled: true
      port: 32525
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
pod:
  replicas:
    api: 1

secrets:
  tls:
    key_manager:
      api:
        public: humanz-barbican-cloud-tls    