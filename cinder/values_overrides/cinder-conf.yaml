conf:
  ceph:
    pools:
      backup:
        replication: 1
      cinder.volumes:
        replication: 1
  cinder:
    DEFAULT:
      os_region_name: RegionOne
      backup_driver: "cinder.backup.drivers.nfs.NFSBackupDriver"
      backup_share: 192.168.20.200:/csi/nfs_cinder/
      backup_container: openstack-backups
      backup_mount_point_base: /backup/openstack/cinder
    keystone_authtoken:
      service_type: block-storage      
endpoints:
  identity:
    hosts:
      default: keystone-api
      internal: keystone-api
    scheme:
      public: https
    port:
      api:
        default: 5000
        public: 443
  image:
    hosts:
      default: glance-api
      internal: glance-api
    scheme:
      public: https
    port:
      api:
        default: 9292
        public: 80
  block_storage:
    name: cinder
    hosts:
      default: cinder-api
      public: cinder
    path:
      default: '/v3/%(tenant_id)s'
    scheme:
      default: 'http'
      service: 'http'
      public: 'https'
    port:
      api:
        default: 8776
        public: 443
        service: 8776
jobs:
  volume_usage_audit:
    cron: "55 * * * *"

manifests:
  ingress_api: true
  service_ingress_api: true

network:
  api:
    node_port:
      enabled: true
      port: 32526
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        cert-manager.io/cluster-issuer: selfsigned-cluster-issuer

pod:
  security_context:
    cinder_volume:
      container:
        cinder_volume:
          privileged: true
    cinder_backup:
      container:
        cinder_backup:
          readOnlyRootFilesystem: false
          runAsGroup: 42424
          runAsUser: 42424
          privileged: true
  mounts:
    cinder_backup:
      cinder_backup:
        volumeMounts:
        - mountPath: /backup/openstack/cinder
          name: nfs-backup
        volumes:
        - emptyDir: {}
          name: nfs-backup

secrets:
  tls:
    block_storage:
      api:
        public: humanz-cloud-tls
