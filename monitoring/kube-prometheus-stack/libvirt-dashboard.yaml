                          "spec": {
                            "expr": "sum by (domain)(\n  rate(libvirt_domain_memory_stats_swap_in_bytes{domain=\"$dom_id\"}[$__rate_interval])\n+\n  rate(libvirt_domain_memory_stats_swap_out_bytes{domain=\"$dom_id\"}[$__rate_interval])\n)\n",
