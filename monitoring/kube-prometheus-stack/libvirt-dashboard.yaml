                          "group": "prometheus",
                          "version": "v0",
                          "datasource": {
                            "name": "${datasource}"
                          },
                          "spec": {
                            "expr": "(rate(libvirt_domain_info_cpu_time_seconds_total{domain=\"$dom_id\"}[$__rate_interval])/libvirt_domain_vcpu_current{domain=\"$dom_id\"}) * 100",
