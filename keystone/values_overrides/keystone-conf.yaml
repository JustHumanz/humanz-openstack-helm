endpoints:
  identity:
    scheme:
      public: https
    port:
      api:
        default: 5000
        public: 443

manifests:
  ingress_api: true
  service_ingress_api: true

network:
  api:
    node_port:
      enabled: true
      port: 32531
    ingress:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        cert-manager.io/cluster-issuer: selfsigned-cluster-issuer

secrets:
  tls:
    identity:
      api:
        public: horizon-tls-public