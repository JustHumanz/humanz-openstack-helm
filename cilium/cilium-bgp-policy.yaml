apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: external-pool
spec:
  blocks:
  - start: "192.168.21.10"
    stop: "192.168.21.200"
  # Optionally restrict to specific services
  # serviceSelector:
  #   matchLabels:
  #     pool: external
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-peering
spec:
  # Apply to nodes with this label
  nodeSelector:
    matchLabels:
      bgp-policy: active
  bgpInstances:
  - name: instance-65252
    localASN: 64251
    peers:
    - name: upstream-router
      peerASN: 64251
      peerAddress: "192.168.20.1"
      peerConfigRef:
        name: upstream-peer-config
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPPeerConfig
metadata:
  name: upstream-peer-config
spec:
  timers:
    holdTimeSeconds: 90
    keepAliveTimeSeconds: 30
    connectRetryTimeSeconds: 120
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
  - afi: ipv4
    safi: unicast
    advertisements:
      matchLabels:
        advertise: bgp
---
apiVersion: cilium.io/v2alpha1
kind: CiliumBGPAdvertisement
metadata:
  name: service-advertisements
  labels:
    advertise: bgp
spec:
  advertisements:
  - advertisementType: "PodCIDR"
  - advertisementType: "Service"
    service:
      addresses:
      - LoadBalancerIP
    selector:
      matchExpressions:
      - key: somekey
        operator: NotIn
        values:
        - never-select-me