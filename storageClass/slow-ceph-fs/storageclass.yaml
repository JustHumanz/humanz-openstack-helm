apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: slow-kube-cephfs
  namespace: openstack
spec:
  metadataPool:
    deviceClass: hdd
    failureDomain: osd
    replicated:
      size: 2
  dataPools:
    - name: replicated
      deviceClass: hdd
      failureDomain: osd
      replicated:
        size: 2
  preserveFilesystemOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-slow-cephfs
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: openstack
  fsName: slow-kube-cephfs
  pool: slow-kube-cephfs-replicated

  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: openstack
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: openstack
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: openstack

reclaimPolicy: Delete