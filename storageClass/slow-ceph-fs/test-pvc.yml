apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slow-cephfs-pvc
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: rook-slow-cephfs
---
apiVersion: v1
kind: Pod
metadata:
  name: slow-cephfs-pod
spec:
  containers:
    - name: cephfs-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: cephfs-storage
          mountPath: /data
  volumes:
    - name: cephfs-storage
      persistentVolumeClaim:
        claimName: slow-cephfs-pvc
