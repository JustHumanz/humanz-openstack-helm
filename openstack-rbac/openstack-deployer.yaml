apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-deployer
  namespace: openstack
---
apiVersion: v1
kind: Secret
metadata:
  name: os-deployer-token
  namespace: openstack
  annotations:
    kubernetes.io/service-account.name: os-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openstack-role
  namespace: openstack
rules:
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets",
                "deployments", "replicasets", "statefulsets", "jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openstack-binding
  namespace: openstack
subjects:
  - kind: ServiceAccount
    name: os-deployer
    namespace: openstack
roleRef:
  kind: Role
  name: openstack-role
  apiGroup: rbac.authorization.k8s.io